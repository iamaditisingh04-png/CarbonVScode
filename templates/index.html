<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CarbonVScode</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>⚡ CarbonVScode</h1>

        <div id="start-screen">
            <h2>Ready to Challenge Yourself?</h2>
            <p>Fun tech. Logic. AI. Chaos. 🔥</p>

            <button id="start-btn">START GAME</button>
        </div>

        <div id="game-screen" style="display: none;">

            <div class="game-header">
                <span id="question-number">Question 1</span>
                <span id="score">Score: 0</span>
                <span id="timer">30</span>
            </div>

            <div class="question-box">

                <div id="category"></div>

                <h2 id="question"></h2>

                <div id="options"></div>

                <div id="result"></div>

                <button id="next-btn" style="display: none;">
                    NEXT →
                </button>

            </div>

        </div>

        <div id="end-screen" style="display: none;">

            <h2>🎉 Game Over!</h2>

            <h1 id="final-score"></h1>

            <p id="final-message"></p>

            <button id="restart-btn">
                PLAY AGAIN
            </button>

        </div>

    </div>

    <script src="{{ url_for('static', filename='questions.js') }}"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
